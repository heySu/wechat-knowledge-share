name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 零依赖项目，不需要 npm install
      - name: 运行端到端测试
        run: npm test

      - name: 冒烟启动（验证服务能拉起来并完成公众号握手）
        run: |
          PORT=3999 PUBLIC_BASE_URL=http://127.0.0.1:3999 node src/index.js &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3999/healthz && break
            sleep 0.5
          done
          node scripts/doctor.mjs http://127.0.0.1:3999
